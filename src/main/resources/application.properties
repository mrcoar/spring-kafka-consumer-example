server.port=8082
spring.kafka.consumer.boostrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.openkm.dto
#En la propiedad de arriba, se aceptan mas paquetes separados por coma o bien usar el asterisco para confiar en todos los paquetes

spring.kafka.consumer.group-id=user-group

